org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.java.installations.auto-detect=true
# auto-download=false: CI uses actions/setup-java; Replit sets JAVA_HOME in the workflow command.
# Do NOT set org.gradle.java.installations.paths here — it would be a Replit Nix path that
# doesn't exist on Windows CI runners, causing "No locally installed toolchains match".
org.gradle.java.installations.auto-download=false
