name: Build Linux Deb / Rpm / AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fuse libfuse2 imagemagick

      - name: Generate PNG icon (focusflow.png)
        run: |
          mkdir -p src/main/resources
          convert -size 256x256 xc:'#09090f' \
            -fill '#4fc3f7' -draw "arc 40,40 216,216 -50,140" \
            -fill '#7c4dff' -draw "arc 40,40 216,216 130,260" \
            -fill '#6699ee' -draw "rectangle 106,128 150,135" \
            src/main/resources/focusflow.png

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux distribution
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./gradlew packageDeb packageRpm packageAppImage

      - name: Upload Deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-deb
          path: build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload Rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-rpm
          path: build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-appimage
          path: build/compose/binaries/main/appImage/*.AppImage
          if-no-files-found: warn
