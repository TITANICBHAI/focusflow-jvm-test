name: Linux Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # xdotool intentionally NOT installed here — tests must pass without it.
      # The WinApiBindingsLinuxTest verifies hasXdotool degrades gracefully.

      - name: Run Linux enforcement smoke tests
        run: ./gradlew test --tests "com.focusflow.enforcement.*" --info
        env:
          # Headless display so AWT doesn't fail to initialise on the CI runner
          DISPLAY: ""
          # No Sentry DSN in CI — telemetry is disabled during tests
          SENTRY_DSN: ""

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: build/reports/tests/test/
          if-no-files-found: warn
